<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Tejashree Badve, Data and AI Engineer">
  <defs>
    <style><![CDATA[
      @keyframes pulse1 { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .12; transform: scale(1.06); } }
      @keyframes pulse2 { 0%,100% { opacity: .30; transform: scale(1); } 50% { opacity: .06; transform: scale(1.10); } }
      @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes drift  { 0% { opacity: .10; } 50% { opacity: .26; } 100% { opacity: .10; } }
      .r1 { animation: pulse1 3.2s ease-in-out infinite; transform-origin: 636px 125px; }
      .r2 { animation: pulse2 3.2s ease-in-out .5s infinite; transform-origin: 636px 125px; }
      .dot { animation: blink 2s ease-in-out infinite; }
      .code { animation: drift 6s ease-in-out infinite; }
      .code2 { animation: drift 6s ease-in-out 2s infinite; }
      .code3 { animation: drift 6s ease-in-out 4s infinite; }
    ]]></style>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1A1030"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.18"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="avatarClip"><circle cx="636" cy="125" r="46"/></clipPath>
    <path id="textCirclePath" d="M 636,125 m -74,0 a 74,74 0 1,1 148,0 a 74,74 0 1,1 -148,0" fill="none"/>
  </defs>

  <rect width="800" height="250" rx="14" fill="url(#bgGrad)"/>

  <g stroke="#22D3EE" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800"/>
    <path d="M50 0 V250 M100 0 V250 M150 0 V250 M200 0 V250 M250 0 V250 M300 0 V250 M350 0 V250 M400 0 V250 M450 0 V250 M500 0 V250 M550 0 V250 M600 0 V250 M650 0 V250 M700 0 V250 M750 0 V250"/>
  </g>
  <circle cx="636" cy="125" r="120" fill="url(#halo)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#22D3EE">
    <text class="code" x="34" y="30">medallion.bronze → silver → gold</text>
    <text class="code2" x="330" y="226">df.repartition(salted_key).persist()</text>
    <text class="code3" x="34" y="226">agent.invoke(state) // typed_graph</text>
  </g>

  <text x="40" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)" letter-spacing="-1">TEJASHREE BADVE</text>
  <rect x="42" y="112" width="250" height="2" fill="url(#ruleGrad)"/>
  <text x="42" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#C084FC" letter-spacing="4.5">DATA &amp; AI ENGINEER</text>
  <text x="42" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#8B949E">Lakehouses, and the agents that query them.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#56D4DD" opacity="0.85">
    <text x="42" y="196">[ DATABRICKS ]</text>
    <text x="152" y="196">[ SNOWFLAKE ]</text>
    <text x="258" y="196">[ LANGGRAPH ]</text>
    <text x="364" y="196">[ QLORA ]</text>
  </g>

  <circle class="r2" cx="636" cy="125" r="66" fill="none" stroke="#C084FC" stroke-width="1.2" filter="url(#softGlow)"/>
  <circle class="r1" cx="636" cy="125" r="56" fill="none" stroke="#22D3EE" stroke-width="1.4" filter="url(#softGlow)"/>

  <g filter="url(#softGlow)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#56D4DD" letter-spacing="2.2">
      <textPath href="#textCirclePath" startOffset="0%">
        SYSTEM.RUN() // MEDALLION // AGENT_GRAPH // RETRIEVAL // FINE_TUNE //
        <animate attributeName="startOffset" from="0%" to="100%" dur="20s" repeatCount="indefinite"/>
      </textPath>
    </text>
  </g>

  <circle cx="636" cy="125" r="47" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.9"/>
  <g clip-path="url(#avatarClip)">
    <!-- REPLACE THIS GROUP with: <image href="data:image/jpeg;base64,..." x="590" y="79" width="92" height="92" preserveAspectRatio="xMidYMid slice"/> -->
    <rect x="590" y="79" width="92" height="92" fill="#131C2B"/>
    <text x="636" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="url(#nameGrad)">TB</text>
  </g>

  <circle class="dot" cx="670" cy="159" r="7" fill="#3FB950" stroke="#0D1117" stroke-width="2.5" filter="url(#softGlow)"/>

  <rect x="0.5" y="0.5" width="799" height="249" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1"/>
</svg>
