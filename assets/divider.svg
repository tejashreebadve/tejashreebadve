<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 18" width="800" height="18" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="8" width="800" height="2" fill="url(#d)" filter="url(#g)"/>
  <circle cx="400" cy="9" r="3.5" fill="#C084FC" filter="url(#g)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
