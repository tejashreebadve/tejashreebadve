<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Terminal session: Tejashree Badve, Data and AI Engineer">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C2432"/>
      <stop offset="100%" stop-color="#151C27"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="t1"><rect x="20" y="58" width="0" height="24">
      <animate attributeName="width" values="0;0;96;96" keyTimes="0;0.031;0.075;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="20" y="116" width="0" height="24">
      <animate attributeName="width" values="0;0;150;150" keyTimes="0;0.125;0.181;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="20" y="226" width="0" height="24">
      <animate attributeName="width" values="0;0;120;120" keyTimes="0;0.269;0.313;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t4"><rect x="20" y="284" width="0" height="24">
      <animate attributeName="width" values="0;0;300;300" keyTimes="0;0.375;0.438;1" dur="16s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="900" height="470" rx="12" fill="#0B0F14"/>
